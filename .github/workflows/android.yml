name: SEARCH-POI Android Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: |
        export NODE_OPTIONS=--openssl-legacy-provider
        npm install

    - name: Install Capacitor CLI
      run: npm install -D @capacitor/core @capacitor/android @capacitor/cli

    - name: Build web app
      run: |
        export NODE_OPTIONS=--openssl-legacy-provider
        npm run build -- --skipLibCheck || npm run build

    - name: Create capacitor.config.ts
      run: |
        echo 'import { CapacitorConfig } from "@capacitor/cli";
        const config: CapacitorConfig = {
          appId: "com.archpoi.searchpoi",
          appName: "SEARCH-POI",
          webDir: "dist",
          bundledWebRuntime: false,
          server: {
            url: "https://engine-v1.pages.dev",
            cleartext: true
          }
        };
        export default config;' > capacitor.config.ts

    - name: Add Android Platform
      run: npx cap add android || npx cap sync android

    - name: Fix Kotlin duplicates
      run: |
        cd android
        echo 'configurations.all {
          resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
            exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
        }' >> app/build.gradle

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SEARCH-POI-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
